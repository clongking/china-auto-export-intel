name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每小时整点重新抓取情报并重新发布（UTC）
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，定时任务与推送重叠时取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore previously published data as fallback
        # 若本次抓取失败，脚本会回退到上一次成功发布的数据，而不是示例数据
        run: |
          mkdir -p public/data
          curl -fsSL --max-time 30 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/intel.json" \
            -o public/data/intel.json || echo "No previously published data available"

      - name: Fetch and classify intel
        # 脚本内部处理所有错误并回退，始终以退出码 0 结束
        run: npm run fetch
        timeout-minutes: 10

      - name: Build static site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
